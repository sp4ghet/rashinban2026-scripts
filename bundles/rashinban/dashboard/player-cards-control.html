<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* NodeCG panels sit on a white card; paint our own dark surface and keep labels readable. */
      html {
        background: #1b232b;
      }

      label {
        color: #efefef;
        font-size: 13px;
      }

      body {
        margin: 0;
        padding: 12px;
        font-family: "Segoe UI", sans-serif;
        font-size: 13px;
        color: #efefef;
        background: #1b232b;
      }

      h4 {
        margin: 12px 0 6px;
        font-size: 11px;
        letter-spacing: 0.15em;
        color: #90a4ae;
        text-transform: uppercase;
      }

      h4:first-child { margin-top: 0; }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .row label { display: flex; gap: 6px; align-items: center; flex: 1; }

      input[type="text"],
      input[type="number"],
      select {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        font-size: 13px;
        color: #fff;
        background: #37474f;
        border: 1px solid #546e7a;
        border-radius: 4px;
      }

      input[type="number"] { max-width: 64px; }

      button {
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #37474f;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }

      button:hover { filter: brightness(1.2); }
      button:disabled { opacity: 0.4; }
      button.active { background: #2e7d32; }

      .status,
      #preview {
        white-space: pre-wrap;
        padding: 6px 8px;
        margin-bottom: 8px;
        font-family: Consolas, monospace;
        font-size: 12px;
        background: #1c2a33;
        border-radius: 4px;
      }

      .status.error { color: #ff8a80; }
      #error { color: #ff8a80; min-height: 1.2em; font-size: 12px; }
      .modes { display: flex; gap: 12px; margin-bottom: 8px; }
      .modes label { display: flex; gap: 4px; align-items: center; }
    </style>
  </head>
  <body><h4>Current match</h4><div id="preview">Loading…</div><p>Select players in the Current Match dashboard panel.</p><h4>Cards</h4>
    <div class="row">
      <button id="cards-visible">Cards hidden</button>
      <button id="cards-page">Page: PROFILE</button>
    </div>
    <div id="error"></div>
    <script src="player-cards-control.js"></script>
  </body>
</html>
