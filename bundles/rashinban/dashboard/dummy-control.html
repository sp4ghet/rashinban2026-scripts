<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* NodeCG panels sit on a white card; paint our own dark surface and keep labels readable. */
      html {
        background: #1b232b;
      }

      label {
        color: #efefef;
        font-size: 13px;
      }

      body {
        margin: 0;
        padding: 12px;
        font-family: "Segoe UI", sans-serif;
        color: #efefef;
        background: #1b232b;
      }

      button {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #37474f;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.2);
      }

      #toggle.active {
        background: #c2185b;
      }

      .round-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }

      .round-row button {
        width: 48px;
      }

      .round-row .label {
        flex: 1;
        text-align: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <button id="toggle">Show Lower Third</button>
    <div class="round-row">
      <button id="decrement">−</button>
      <div class="label">Round <span id="round-value">1</span></div>
      <button id="increment">＋</button>
    </div>
    <script src="dummy-control.js"></script>
  </body>
</html>
