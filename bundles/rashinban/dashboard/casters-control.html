<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* NodeCG panels sit on a white card; paint our own dark surface and keep labels readable. */
      html {
        background: #1b232b;
      }

      body {
        margin: 0;
        padding: 12px;
        font-family: "Segoe UI", sans-serif;
        font-size: 13px;
        color: #efefef;
        background: #1b232b;
      }

      h4 {
        margin: 12px 0 6px;
        font-size: 11px;
        letter-spacing: 0.15em;
        color: #90a4ae;
        text-transform: uppercase;
      }

      h4:first-child { margin-top: 0; }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      select {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        font-size: 13px;
        color: #fff;
        background: #37474f;
        border: 1px solid #546e7a;
        border-radius: 4px;
      }

      button {
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #37474f;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }

      button:hover { filter: brightness(1.2); }
      button.active { background: #2e7d32; }

      .status {
        white-space: pre-wrap;
        padding: 6px 8px;
        margin-bottom: 8px;
        font-family: Consolas, monospace;
        font-size: 12px;
        background: #1c2a33;
        border-radius: 4px;
      }

      #error { color: #ff8a80; min-height: 1.2em; font-size: 12px; }
      p { margin: 6px 0; color: #b0bec5; font-size: 12px; }
    </style>
  </head>
  <body>
    <h4>Left card</h4>
    <div class="row">
      <select id="slot-0-name"></select>
      <button id="slot-0-enabled">Hidden</button>
    </div>

    <h4>Right card</h4>
    <div class="row">
      <select id="slot-1-name"></select>
      <button id="slot-1-enabled">Hidden</button>
    </div>

    <h4>Visible</h4>
    <div class="status" id="preview">Loading…</div>
    <p>Names come from the <strong>casters</strong> tab of the Google Sheet. Edit the sheet to add a caster, then pick them here.</p>
    <div id="error"></div>
    <script src="casters-control.js"></script>
  </body>
</html>
