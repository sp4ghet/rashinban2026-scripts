<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RASHINBAN 2026 — Presenter</title><link rel="stylesheet" href="presenter.css"></head>
<body data-layout="dual" data-source="chroma" data-phase="waiting-game">
  <div class="backdrop"></div>
  <div class="edition">RASHINBAN <span>2026</span><i>DUELS</i></div>
  <header class="scoreboard">
    <div class="competitor left"><span class="handle" id="left-handle"></span><strong id="left-name">PLAYER 1</strong><b class="wins" id="left-wins">0</b></div>
    <div class="match-info"><div><small>ROUND</small><b id="round-number">—</b></div><div><small>GAME</small><b id="game-number">—</b></div><div class="mode-info"><small>GAME MODE</small><b id="mode">—</b></div></div>
    <div class="competitor right"><b class="wins" id="right-wins">0</b><strong id="right-name">PLAYER 2</strong><span class="handle" id="right-handle"></span></div>
  </header>
  <div class="damage left"><small id="multiplier-label">DAMAGE</small><b id="multiplier">×1</b></div>
  <div class="damage right"><small id="right-multiplier-label">DAMAGE</small><b id="right-multiplier">×1</b></div>
  <div class="health left"><div class="health-fill" id="left-health-fill"></div><b id="left-health">—</b></div>
  <div class="health right"><div class="health-fill" id="right-health-fill"></div><b id="right-health">—</b></div>
  <main id="live-area">
    <div id="shared-panorama" class="shared-view"><span>View unavailable</span></div>
    <section class="player-window left" id="left-window"><div class="player-view key-slot" id="left-view"><span class="view-unavailable">View unavailable</span></div><div class="player-map" id="left-map"></div><div class="lock" id="left-lock" hidden>LOCKED IN</div></section>
    <section class="player-window right" id="right-window"><div class="player-view key-slot" id="right-view"><span class="view-unavailable">View unavailable</span></div><div class="player-map" id="right-map"></div><div class="lock" id="right-lock" hidden>LOCKED IN</div></section>
  </main>
  <section id="preview-area" hidden>
    <div id="preview-panorama" class="key-slot"></div><div id="preview-map"></div>
    <div id="preview-label"></div><strong id="preview-countdown" hidden></strong>
  </section>
  <section id="waiting-area">WAITING FOR GAME</section>
  <section id="summary-area" hidden>
    <h1 id="summary-title">GAME FINISHED</h1>
  </section>
  <div id="review-banner" hidden>GAME IS UNDER REVIEW</div>
  <section id="results-area" hidden>
    <div id="results-map"><span>ROUND RESULTS</span></div>
    <div id="tie-range-label" hidden></div>
    <div class="result left" id="left-result"><small id="left-distance">—</small><strong id="left-score">—</strong><span>POINTS</span></div>
    <div class="result right" id="right-result"><small id="right-distance">—</small><strong id="right-score">—</strong><span>POINTS</span></div>
  </section>
  <div id="scoring-layer" hidden aria-hidden="true"><strong id="score-token-left" class="score-token left" hidden></strong><strong id="score-token-right" class="score-token right" hidden></strong><b id="score-calculation" hidden></b></div>
  <div id="transition" hidden>ROUND COMPLETE</div>
  <div id="timer" hidden>00:00</div>
  <div class="camera key-slot left"></div><div class="camera key-slot right"></div>
  <footer><div id="phase-label">WAITING FOR GAME</div><div class="wordmark">RASHINBAN<span>2026</span></div></footer>
  <script src="presenter.js"></script>
</body>
</html>
