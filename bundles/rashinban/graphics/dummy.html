<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>RASHINBAN 2026 — Dummy Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }

      #lower-third {
        position: absolute;
        left: 80px;
        bottom: 80px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 20px 40px;
        color: #fff;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-left: 6px solid #c2185b;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transform: translateX(-120%);
        opacity: 0;
        transition:
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.4s ease;
      }

      #lower-third.visible {
        transform: translateX(0);
        opacity: 1;
      }

      #title {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      #round {
        font-size: 28px;
        font-weight: 600;
        color: #ff6090;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <div id="lower-third">
      <span id="title">RASHINBAN 2026</span>
      <span id="round">ROUND 1</span>
    </div>
    <script src="dummy.js"></script>
  </body>
</html>
