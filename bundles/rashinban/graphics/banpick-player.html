<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>RASHINBAN 2026 &mdash; Ban &amp; Pick (Player)</title>
    <link rel="stylesheet" href="https://use.typekit.net/ljs6bhu.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="banpick-player.css" />
  </head>
  <body>
    <div id="panel">
      <header>
        <div class="player a"><span id="name-a">Player A</span></div>
        <div class="versus">VS</div>
        <div class="player b"><span id="name-b">Player B</span></div>
      </header>
      <div id="turn-label" role="status" aria-live="polite"><span id="step"></span></div>
      <div id="board"></div>
    </div>
    <div id="confirm">
      <span id="confirm-text"></span>
      <button id="confirm-no">Cancel</button>
      <button id="confirm-yes">Confirm</button>
    </div>
    <div id="toast"></div>
    <script src="banpick-player.js"></script>
  </body>
</html>
